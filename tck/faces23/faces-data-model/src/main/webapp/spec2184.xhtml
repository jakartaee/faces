<!DOCTYPE html>

<html xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Application createDataModel</title>
    </h:head>
    <h:body>
        <span id="mostSpecificModel">#{spec2184Bean.mostSpecificModel}</span>
        <span id="mostSpecificModelWrapsValue">#{spec2184Bean.mostSpecificModelWrapsValue}</span>
        <span id="unregisteredModelNull">#{spec2184Bean.unregisteredModelNull}</span>
        <h:dataTable id="table" value="#{spec2184Bean.value}" var="row">
            <h:column><span class="tableRow">#{row}</span></h:column>
        </h:dataTable>
        <div id="repeat">
            <ui:repeat value="#{spec2184Bean.value}" var="row">
                <span class="repeatRow">#{row}</span>
            </ui:repeat>
        </div>
    </h:body>
</html>
