<!DOCTYPE html>
<html lang="en"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
>
    <h:head>
        <title>spec1002: component implicit object in rendered attribute</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:inputText id="input" value="#{spec1002Bean.value}" rendered="#{component.id eq 'input'}" />
            <ui:repeat id="repeat" value="#{['item']}" rendered="#{component.id eq 'repeat'}">
                <h:inputText id="repeatedInput" value="#{spec1002Bean.repeatedValue}" />
                <h:commandButton id="ajaxInsideRepeat" value="ajaxInsideRepeat">
                    <f:ajax execute="repeatedInput" render=":repeatedValue" />
                </h:commandButton>
            </ui:repeat>
            <h:commandButton id="submit" value="submit" />
            <h:commandButton id="ajax" value="ajax">
                <f:ajax execute="input" render=":value" />
            </h:commandButton>
        </h:form>
        <h:outputText id="value" value="#{spec1002Bean.value}" rendered="#{component.id eq 'value'}" />
        <h:outputText id="repeatedValue" value="#{spec1002Bean.repeatedValue}" />
    </h:body>
</html>
