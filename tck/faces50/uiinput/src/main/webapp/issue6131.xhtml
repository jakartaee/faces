<html xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Radio button groups in nested iterating components</title>
    </h:head>
    <h:body>
        <h:form id="repeat">
            <ui:repeat id="o" var="group" value="#{issue6131Bean.groups}">
                <ui:repeat id="i" var="number" value="#{issue6131Bean.numbers}">
                    <h:selectOneRadio id="radio" value="#{issue6131Bean.values[group]}" group="#{group}">
                        <f:selectItem itemValue="#{number}" itemLabel="#{group}: #{number}" />
                    </h:selectOneRadio>
                </ui:repeat>
            </ui:repeat>
            <h:commandButton id="submit" value="Submit" />
            <h:outputText id="output" value="#{issue6131Bean.values}" />
        </h:form>

        <h:form id="table">
            <h:dataTable id="o" var="group" value="#{issue6131Bean.groups}">
                <h:column>
                    <h:dataTable id="i" var="number" value="#{issue6131Bean.numbers}">
                        <h:column>
                            <h:selectOneRadio id="radio" value="#{issue6131Bean.values[group]}" group="#{group}">
                                <f:selectItem itemValue="#{number}" itemLabel="#{group}: #{number}" />
                            </h:selectOneRadio>
                        </h:column>
                    </h:dataTable>
                </h:column>
            </h:dataTable>
            <h:commandButton id="submit" value="Submit" />
            <h:outputText id="output" value="#{issue6131Bean.values}" />
        </h:form>

        <h:form id="single">
            <ui:repeat id="r" var="number" value="#{issue6131Bean.numbers}">
                <h:selectOneRadio id="radio" value="#{issue6131Bean.single}" group="single">
                    <f:selectItem itemValue="#{number}" itemLabel="#{number}" />
                </h:selectOneRadio>
            </ui:repeat>
            <h:commandButton id="submit" value="Submit" />
            <h:outputText id="output" value="#{issue6131Bean.single}" />
        </h:form>

        <h:form id="required">
            <ui:repeat id="r" var="number" value="#{issue6131Bean.numbers}">
                <h:selectOneRadio id="radio" value="#{issue6131Bean.single}" group="required" required="true">
                    <f:selectItem itemValue="#{number}" itemLabel="#{number}" />
                </h:selectOneRadio>
            </ui:repeat>
            <h:commandButton id="submit" value="Submit" />
            <h:outputText id="output" value="#{issue6131Bean.single}" />
            <h:messages id="messages" />
        </h:form>

        <h:form id="hidden">
            <h:selectOneRadio id="radio0" value="#{issue6131Bean.single}" group="hidden" required="true" rendered="#{param.hide ne 'true'}">
                <f:selectItem itemValue="0" />
            </h:selectOneRadio>
            <h:selectOneRadio id="radio1" value="#{issue6131Bean.single}" group="hidden" required="true">
                <f:selectItem itemValue="1" />
            </h:selectOneRadio>
            <h:selectOneRadio id="radio2" value="#{issue6131Bean.single}" group="hidden" required="true">
                <f:selectItem itemValue="2" />
            </h:selectOneRadio>
            <h:commandButton id="submit" value="Submit" />
            <h:commandButton id="submitHiding" value="Submit and hide first member">
                <f:param name="hide" value="true" />
            </h:commandButton>
            <h:messages id="messages" />
        </h:form>
    </h:body>
</html>
