<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>vanished entry</title></h:head>
    <h:body>
        <h:form id="form">
            <h:commandButton id="show" value="show" action="#{issue5961Bean.show}" />
            <c:forEach items="#{issue5961Bean.shown ? issue5961Rows.fullMap : issue5961Rows.partialMap}"
                       var="entry" varStatus="loop">
                <h:inputText id="input#{loop.count - 1}" value="#{issue5961Rows.partialMap[entry.key]}" />
            </c:forEach>
            <h:commandButton id="submit" value="submit" />
            <h:outputText id="entries" value="#{issue5961Rows.partialMap}" />
        </h:form>
    </h:body>
</html>
