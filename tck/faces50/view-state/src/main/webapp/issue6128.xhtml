<html xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Row without saved state in a table with rowStatePreserved</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:dataTable id="table" value="#{issue6128Bean.tableRows}" var="row" rowStatePreserved="true">
                <h:column>
                    <h:panelGroup id="cell">
                        <f:event type="postAddToView" listener="#{issue6128Bean.addInput}" />
                    </h:panelGroup>
                </h:column>
            </h:dataTable>
            <ui:repeat id="repeat" value="#{issue6128Bean.repeatRows}" var="row" rowStatePreserved="true">
                <h:panelGroup id="cell">
                    <f:event type="postAddToView" listener="#{issue6128Bean.addInput}" />
                </h:panelGroup>
            </ui:repeat>
            <h:commandButton id="submit" value="Submit" />
            <h:commandButton id="addRow" value="Add row" action="#{issue6128Bean.addRow}">
                <f:ajax execute="@this" render="@form" />
            </h:commandButton>
        </h:form>
    </h:body>
</html>
