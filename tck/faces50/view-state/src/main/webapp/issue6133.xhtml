<html xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Validator added to one row of a table with rowStatePreserved</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <!-- The inputs must have no validator in their initial state. -->
            <f:validateBean disabled="true">
                <h:dataTable id="table" value="#{issue6133Bean.tableRows}" var="row" rowStatePreserved="true">
                    <h:column>
                        <h:inputText id="in" value="#{row.name}" />
                        <h:commandButton id="restrict" value="Restrict" actionListener="#{issue6133Bean.restrict}" />
                        <h:message id="message" for="in" />
                    </h:column>
                </h:dataTable>
                <ui:repeat id="repeat" value="#{issue6133Bean.repeatRows}" var="row" rowStatePreserved="true">
                    <h:inputText id="in" value="#{row.name}" />
                    <h:commandButton id="restrict" value="Restrict" actionListener="#{issue6133Bean.restrict}" />
                    <h:message id="message" for="in" />
                </ui:repeat>
            </f:validateBean>
            <h:outputText id="tableNames" value="#{issue6133Bean.tableNames}" />
            <h:outputText id="repeatNames" value="#{issue6133Bean.repeatNames}" />
            <h:commandButton id="submit" value="Submit" />
            <h:commandButton id="addRow" value="Add row" action="#{issue6133Bean.addRow}">
                <f:ajax execute="@this" render="@form" />
            </h:commandButton>
        </h:form>
    </h:body>
</html>
